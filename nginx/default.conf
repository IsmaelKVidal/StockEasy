server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker (permite o Nginx iniciar mesmo se um serviço ainda não existir)
    resolver 127.0.0.11 valid=10s;

    # Requisições da API vão para o back-end
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Todo o resto vai para o front-end
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
